[project]
name = "phishing-email-header-analyzer"
version = "0.1.0"
description = "Analyze .eml files for phishing indicators (SPF/DKIM/DMARC, sender mismatch, urgency keywords)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kaan Turan" }]
dependencies = []

[project.scripts]
phishing-email-header-analyzer = "phishing_email_header_analyzer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["phishing_email_header_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py39"
